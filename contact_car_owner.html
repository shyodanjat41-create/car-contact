<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Car Owner</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f4f4f4;font-family:Arial,sans-serif;color:#111}
  .card{width:min(92%,420px);background:#fff;border-radius:24px;padding:34px 24px;
        text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.12)}
  .car{font-size:48px;margin-bottom:10px}
  h1{font-size:28px;margin:8px 0 10px}
  p{font-size:16px;color:#666;line-height:1.5;margin:0 0 26px}
  a{display:block;text-decoration:none;background:#111;color:#fff;padding:17px;
    border-radius:14px;font-size:19px;font-weight:700}
  .note{font-size:12px;color:#999;margin-top:18px}
</style>
</head>
<body>
  <main class="card">
    <div class="car">🚗</div>
    <h1>Contact Car Owner</h1>
    <p>For any issue regarding this car, please contact the owner.</p>
    <a href="tel:+917007095255">📞 Call Owner</a>
    <div class="note">Tap the button to contact the owner.</div>
  </main>
</body>
</html>
